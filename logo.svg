<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&amp;family=Playfair+Display:wght@600&amp;display=swap');
      .circle { 
        fill: none; 
        stroke: url(#goldGrad); 
        stroke-width: 14; 
      }
      .title { 
        font-family: 'Montserrat', sans-serif; 
        font-size: 96px; 
        font-weight: 900; 
        fill: url(#goldGrad); 
        letter-spacing: 2px; 
      }
      .subtitle { 
        font-family: 'Playfair Display', serif; 
        font-size: 27px; 
        font-weight: 600; 
        fill: #faecd0; 
        letter-spacing: 1.5px; 
      }
    </style>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceabb"/>
      <stop offset="50%" stop-color="#f8b500"/>
      <stop offset="100%" stop-color="#b88b3f"/>
    </linearGradient>
  </defs>

  <!-- Fondo oscuro opcional si se ve fuera de la página, pero lo dejaremos transparente -->
  
  <circle cx="250" cy="250" r="230" class="circle" />
  <text x="250" y="270" text-anchor="middle" class="title">LA VIÑA</text>
  <text x="250" y="330" text-anchor="middle" class="subtitle">MINISUPER &amp; LICORERA</text>
</svg>